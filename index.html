<title>Oliver Tero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Oliver, il tuo tutor di inglese: parli, lui ti risponde, ti corregge e ti spiega le regole.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: one calm reading column for the conversation, a "notebook" board beside it on wide screens.
   Identity: ink on paper + a highlighter that marks every correction. */
:root {
  --bg: #F1F2EC;
  --surface: #FFFFFF;
  --surface-2: #E7E9E1;
  --ink: #151D2E;
  --ink-2: #545F73;
  --line: #D2D6CA;
  --accent: #2747C8;
  --accent-soft: #E3E8FB;
  --mark: #DCF04A;
  --mark-ink: #151D2E;
  --bad: #B23A22;
  --bad-bg: #F7E3DC;
  --good: #1C7347;
  --good-bg: #DCEFE3;
  --shadow: 0 1px 2px rgba(21,29,46,.05), 0 10px 30px rgba(21,29,46,.07);
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 16px;
  --r-sm: 10px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E121B; --surface: #161C29; --surface-2: #1F2635; --ink: #E9ECF3; --ink-2: #9AA4B8; --line: #2B3344;
    --accent: #93A6FF; --accent-soft: #1F2747; --mark: rgba(214,240,64,.30); --mark-ink: #F3F7D8;
    --bad: #FF8F76; --bad-bg: #3A1E18; --good: #62D69D; --good-bg: #13301F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E121B; --surface: #161C29; --surface-2: #1F2635; --ink: #E9ECF3; --ink-2: #9AA4B8; --line: #2B3344;
  --accent: #93A6FF; --accent-soft: #1F2747; --mark: rgba(214,240,64,.30); --mark-ink: #F3F7D8;
  --bad: #FF8F76; --bad-bg: #3A1E18; --good: #62D69D; --good-bg: #13301F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
html.locked, html.locked body { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.label { font-family: var(--f-display); font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.wrap { padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
svg.i { width: 20px; height: 20px; flex: none; }

/* ---------- Top bar & tabs ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--bg); }
.top-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 16px; height: 60px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.45rem; letter-spacing: -0.03em; background: none; border: 0; padding: 0; display: flex; align-items: center; gap: 2px; color: var(--ink); }
.brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; margin-left: 3px; margin-top: 8px; }
.tabs { margin-left: auto; display: flex; gap: 4px; }
.tab { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 8px 14px; border-radius: 999px; color: var(--ink-2); font-weight: 700; transition: background .15s, color .15s; }
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }
@media (max-width: 760px) {
  .top-in { height: 54px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0; justify-content: space-around; gap: 0;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px var(--gutter-r) calc(6px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); }
  .tab { flex-direction: column; gap: 2px; font-size: .75rem; padding: 6px 12px; min-width: 72px; border-radius: 12px; }
  .tab[aria-current="page"] { box-shadow: none; background: var(--surface-2); }
  main { padding-bottom: 96px !important; }
}

main { max-width: 1120px; margin: 0 auto; padding-block: 28px 64px; }
.view { display: grid; gap: 24px; animation: rise .35s ease both; }
@keyframes rise { from { opacity: .001; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Buttons, chips, cards ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 999px; border: 1px solid transparent; font-weight: 700; transition: transform .1s, background .15s, opacity .15s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.primary:hover:not([disabled]) { background: var(--accent); color: #fff; }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.ghost:hover:not([disabled]) { background: var(--surface-2); }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.sm { min-height: 36px; padding: 6px 14px; font-size: .9rem; }
.btn.lg { min-height: 54px; padding: 14px 26px; font-size: 1.05rem; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); }
.link-btn { background: none; border: 0; padding: 4px 2px; color: var(--accent); font-weight: 700; display: inline-flex; gap: 6px; align-items: center; min-height: 32px; }
.link-btn:hover { text-decoration: underline; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; min-height: 38px; font-size: .93rem; transition: background .15s, border-color .15s; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"]::before { content: "✓"; font-size: .8em; }
.chip-add { display: inline-flex; gap: 6px; }
.chip-add input { border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 7px 14px; min-height: 38px; width: 180px; max-width: 100%; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.card.raised { box-shadow: var(--shadow); border-color: transparent; }
.card h2 { font-size: 1.25rem; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 860px) { .grid-2 { grid-template-columns: 1fr; } }

.field { display: grid; gap: 8px; }
.field > span { font-weight: 700; }
.input, select.input, textarea.input { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 10px 12px; min-height: 44px; width: 100%; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.notice { border-radius: var(--r-sm); padding: 14px 16px; background: var(--accent-soft); display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.notice.warn { background: var(--bad-bg); }
.notice p { flex: 1 1 240px; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 22px; color: var(--ink-2); }

/* ---------- Onboarding ---------- */
.onboard { max-width: 760px; margin: 0 auto; }
.hello { display: grid; gap: 12px; padding-top: 8px; }
.hello h1 { font-size: clamp(2.1rem, 6vw, 3.3rem); font-weight: 800; letter-spacing: -0.035em; }
.hello h1 em { font-style: normal; background: linear-gradient(transparent 58%, var(--mark) 58%); padding: 0 .08em; }
.hello p { font-size: 1.1rem; max-width: 60ch; color: var(--ink-2); }
.promise { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.promise div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 14px; display: grid; gap: 4px; }
.promise strong { font-family: var(--f-display); }
.promise span { color: var(--ink-2); font-size: .93rem; }
@media (max-width: 640px) { .promise { grid-template-columns: 1fr; } }

/* ---------- Home ---------- */
.greet { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.greet h1 { font-size: clamp(1.9rem, 5vw, 2.7rem); font-weight: 800; letter-spacing: -0.03em; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; }
.stat { display: grid; }
.stat b { font-family: var(--f-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: .82rem; color: var(--ink-2); }
.cefr { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 4px; max-width: 420px; }
.cefr span { text-align: center; font-family: var(--f-display); font-weight: 700; font-size: .85rem; padding: 6px 0; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
.cefr span.on { background: var(--mark); color: var(--mark-ink); }
.cefr span.past { color: var(--ink); }

.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.mode { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: var(--r-sm); padding: 12px 14px; display: grid; gap: 3px; transition: border-color .15s, background .15s, transform .1s; min-height: 76px; align-content: start; }
.mode:hover { border-color: var(--ink-2); }
.mode:active { transform: scale(.99); }
.mode strong { font-family: var(--f-display); font-size: 1rem; }
.mode span { font-size: .86rem; color: var(--ink-2); line-height: 1.35; }
.mode[aria-checked="true"] { border-color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--ink); }
.start-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.start-row .field { flex: 1 1 260px; }
.resume { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 18px 22px; }
.resume .btn.primary { background: var(--mark); color: var(--mark-ink); }
:root[data-theme="dark"] .resume .btn.primary { color: #151D2E; background: #DCF04A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .resume .btn.primary { color: #151D2E; background: #DCF04A; } }
.resume p { opacity: .8; }
.list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.list li { display: grid; gap: 2px; padding-bottom: 10px; border-bottom: 1px solid var(--line); min-width: 0; }
.list li:last-child { border-bottom: 0; padding-bottom: 0; }
.list li > .said, .list li > .better { justify-self: start; }
.said { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.better { background: linear-gradient(transparent 55%, var(--mark) 55%); color: var(--ink); font-weight: 700; padding: 0 .1em; }
.pill { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.review { background: var(--mark); color: var(--mark-ink); }

/* ---------- Session ---------- */
.session { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); }
.s-head { display: flex; align-items: center; gap: 10px; padding: 8px var(--gutter-r) 8px var(--gutter-l); border-bottom: 1px solid var(--line); background: var(--bg); min-width: 0; }
.s-title { flex: 1; min-width: 0; display: grid; }
.s-mode { font-family: var(--f-display); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-meta { font-size: .82rem; color: var(--ink-2); display: flex; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 520px) { #s-board-btn .txt { display: none; } #s-board-btn { padding: 6px 10px; } .s-head { gap: 6px; } .ratio-bar { width: 36px; } }
.ratio { display: inline-flex; align-items: center; gap: 6px; }
.ratio-bar { width: 56px; height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: inline-block; }
.ratio-bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.s-body { min-height: 0; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.s-chips svg.i { width: 16px; height: 16px; }
.s-chat { min-height: 0; overflow-y: auto; overscroll-behavior: contain; scroll-behavior: smooth; }
.s-msgs { max-width: 760px; margin: 0 auto; padding: 24px var(--gutter-r) 24px var(--gutter-l); display: grid; gap: 26px; }
.s-board { display: none; }
@media (min-width: 1100px) {
  .s-body { grid-template-columns: minmax(0, 1fr) 360px; }
  .s-board { display: block; border-left: 1px solid var(--line); overflow-y: auto; background: var(--surface); }
  #s-board-btn { display: none; }
}
.board-in { padding: 20px; display: grid; gap: 20px; }
.board-sec { display: grid; gap: 10px; }
.board-sec .list li { font-size: .93rem; }
.sheet { position: fixed; inset: 0; z-index: 60; background: rgba(10,14,22,.45); display: flex; align-items: flex-end; }
.sheet-panel { background: var(--surface); width: 100%; max-height: 82vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .25s ease both; }
@keyframes up { from { transform: translateY(30px); opacity: .001; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 14px var(--gutter-r) 0 var(--gutter-l); }

.msg { display: grid; gap: 10px; animation: rise .3s ease both; min-width: 0; }
.msg.me { justify-items: end; }
.bubble { background: var(--surface-2); border-radius: 18px 18px 4px 18px; padding: 10px 16px; max-width: min(560px, 88%); white-space: pre-wrap; overflow-wrap: anywhere; }
.who { display: flex; align-items: center; gap: 8px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: .85rem; flex: none; }
.avatar.talking { box-shadow: 0 0 0 4px var(--mark); }
.reply { font-size: 1.08rem; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.ask { display: grid; gap: 4px; }
.ask .label { color: var(--accent); }
.ask p { font-size: 1.12rem; font-weight: 700; line-height: 1.45; }
.note { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 12px 14px; display: grid; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.note .row { display: grid; gap: 2px; }
.note .k { font-size: .78rem; font-weight: 700; color: var(--ink-2); }
.note.fix { border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
.note.sound .ipa { font-family: 'Charis SIL', 'Doulos SIL', 'Gentium Plus', 'Lucida Sans Unicode', 'Segoe UI', var(--f-body); }
.note.lesson { background: var(--accent-soft); border-color: transparent; white-space: pre-wrap; }
.note.nlp { border-style: dashed; }
.msg-actions { display: flex; gap: 4px; flex-wrap: wrap; margin-left: -6px; }
.msg-actions button { background: none; border: 0; color: var(--ink-2); font-weight: 700; font-size: .85rem; padding: 6px 8px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; }
.msg-actions button:hover { background: var(--surface-2); color: var(--ink); }
.msg-actions svg.i { width: 16px; height: 16px; }
.thinking { display: inline-flex; gap: 5px; padding: 8px 0; }
.thinking i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); animation: blink 1.2s infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.err { color: var(--bad); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.s-foot { border-top: 1px solid var(--line); background: var(--bg); padding: 10px var(--gutter-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); }
.s-foot-in { max-width: 760px; margin: 0 auto; display: grid; gap: 8px; }
.s-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.s-chips::-webkit-scrollbar { display: none; }
.s-chips .chip { flex: none; min-height: 34px; padding: 5px 12px; font-size: .86rem; }
.s-chips .chip[aria-pressed="true"]::before { content: none; }
.composer { display: flex; align-items: flex-end; gap: 10px; }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); background: var(--surface); border-radius: 22px; padding: 11px 16px; min-height: 48px; max-height: 160px; line-height: 1.45; }
.composer textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.mic { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; position: relative; transition: transform .1s, background .15s; }
.mic svg.i { width: 24px; height: 24px; }
.mic:active { transform: scale(.94); }
.mic.on { background: var(--accent); color: #fff; }
.mic.on::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid var(--accent); opacity: .5; animation: pulse 1.4s ease-out infinite; }
@keyframes pulse { from { transform: scale(.9); opacity: .6; } to { transform: scale(1.25); opacity: 0; } }
.send { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.send:not([disabled]):hover { background: var(--ink); color: var(--bg); }
.send[disabled] { opacity: .4; cursor: not-allowed; }
.s-partial { font-style: italic; color: var(--ink-2); padding: 0 4px; min-height: 1.4em; overflow-wrap: anywhere; }
.s-status { font-size: .85rem; color: var(--ink-2); display: flex; gap: 10px; align-items: center; min-height: 28px; flex-wrap: wrap; }
.s-status .link-btn { min-height: 28px; }
.hint { font-size: .82rem; color: var(--ink-2); }

/* ---------- Report ---------- */
.report { max-width: 820px; margin: 0 auto; width: 100%; }
.report-hero { display: grid; gap: 8px; }
.report-hero h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 800; letter-spacing: -0.03em; }
.well { display: grid; gap: 10px; counter-reset: w; margin: 0; padding: 0; list-style: none; }
.well li { display: flex; gap: 12px; align-items: flex-start; }
.well li::before { content: "✓"; flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--good-bg); color: var(--good); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.word { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; display: grid; gap: 4px; background: var(--surface); align-content: start; min-width: 0; overflow-wrap: anywhere; }
.word strong { font-family: var(--f-display); font-size: 1.05rem; }
.word .ex { font-style: italic; color: var(--ink-2); font-size: .93rem; }
.word-head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
pre.profile { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); border-radius: var(--r-sm); padding: 14px 16px; margin: 0; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: .85rem; line-height: 1.6; }
.loading-block { display: grid; gap: 12px; }
.shimmer { height: 16px; border-radius: 8px; background: linear-gradient(90deg, var(--surface-2), var(--surface), var(--surface-2)); background-size: 200% 100%; animation: sh 1.4s infinite linear; }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ---------- Notebook & profile ---------- */
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 2px; flex-wrap: wrap; }

  catch {

/* ================= Platform capabilities ================= */
const C = window.claude;
const use = (name) => (C && typeof C.use === 'function') ? C.use(name).catch(() => null) : Promise.resolve(null);
const Caps = { sample: null, dictation: null, tts: null, perms: null, ready: false };

/* ================= Storage (private per viewer) ================= */

  db: null, base: null, chains: {},

    const [db, user] = await Promise.all([use('db'), use('user')]);

  },
  get remote() { return !!this.db; },
  ser(key, fn) {

    this.chains[key] = next; return next;
  },
  async getDoc(name) {
    if (!this.db) return LS.get(name);
    const snap = await withTimeout(this.db.doc(this.base + '/' + name).get(), 10000);
    return snap.exists ? clone(snap.data()) : null;

  setDoc(name, data) {

  delDoc(name) {
    LS.del(name);
    if (!this.db) return Promise.resolve();

  async addSession(s) {
    const list = LS.get('sessions') || []; list.unshift(s); LS.set('sessions', list.slice(0, 150));
    if (!this.db) return;
    await this.sessionsCol().doc(s.id).set(clone(s));
  },
  async listSessions() {
    if (!this.db) return LS.get('sessions') || [];
    const q = await withTimeout(this.sessionsCol().orderBy('endedAt', 'desc').limit(150).get(), 10000);
    const list = q.docs.map((d) => clone(d.data()));
    LS.set('sessions', list); return list;
  },
  async wipe() {
    if (this.db) {
      try { const q = await this.sessionsCol().get(); for (const d of q.docs) await this.sessionsCol().doc(d.id).delete(); } catch {}
      try { await this.db.doc(this.base + '/current').delete(); } catch {}
      try { await this.db.doc(this.base + '/profile').delete(); } catch {}

/* ================= App state ================= */
const DEFAULT_SETTINGS = { voiceOn: true, voice: 'buttery', rate: 1, autoSend: true, readAll: false, accurate: false, correction: 'normal' };
const LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
const GOALS = ['Riunioni di lavoro', 'Colloqui di lavoro', 'Viaggi', 'Small talk', 'Presentazioni', 'Conversazioni profonde', 'Esami (IELTS, TOEFL…)'];
const INTERESTS = ['tech', 'football', 'cooking', 'spirituality', 'physics', 'chemistry', 'theosophy', 'English grammar', 'astrology', 'astrophysics', 'neuro-linguistic programming', 'deep conversations'];
const MODES = [
  { id: 'free', name: 'Conversazione libera', desc: 'La tua vita, le tue idee, i tuoi interessi.', line: () => 'free talk: my life, interests, opinions.' },

  { id: 'nlp', name: 'Laboratorio PNL', desc: 'Conversazione profonda sugli schemi della PNL, in inglese.', line: () => 'NLP lab: a deep conversation exploring neuro-linguistic programming patterns (meta-model questions, reframing, presuppositions, sensory predicates, modal operators, Milton-model language, anchoring) through English. Teach one pattern at a time with [NLP], have me use it in English, and keep correcting my English as usual.' },

const modeById = (id) => MODES.find((m) => m.id === id) || MODES[0];
const CORRECTION = { normal: 'Correzioni: normali', strict: 'Correzioni: tutte', flow: 'Correzioni: a fine sessione' };

/* ================= Tutor prompt ================= */
function lpText(lp) {
  if (!lp) return 'none';

## About me
- Native language: Italian
- Level: ${level}
- Goals: ${asList(p.goals).join(', ') || 'not specified yet: ask me'}
- Interests: ${asList(p.interests).join(', ') || 'not specified yet: ask me'}
- Learner profile from previous sessions:
${lpText(p.lp)}

## How every reply works
1. First, respond to WHAT I said like a real person: react, share an opinion or a short story. Keep the conversation alive.
2. Then, if I made mistakes, correct and TEACH with [FIX]: what I said, the better version, the rule in 1-2 simple sentences with one extra example, and the "Italian trap" when relevant (why an Italian speaker makes this mistake, e.g. In Italian you say "ho 30 anni", but English uses "to be": I AM 30).
   - Max 2 corrections per turn. Priority: errors that change meaning > my recurring errors from the profile > typical Italian-speaker errors (false friends, present perfect vs past simple, since/for, missing subject, prepositions, word order, uncountable nouns, make vs do, etc.).
   - Also flag sentences that are correct but unnatural with [NATURAL].
   - Explain rules in plain language, not technical jargon. If you use a grammar term (e.g. "present perfect"), explain it briefly the first time.
   - If there's nothing important to fix, don't comment. Don't praise every turn.
3. End with ONE open question (never yes/no) that makes me keep talking and, when possible, makes me reuse the structure you just corrected.

## Articulation, conversation skills and NLP
- Articulation ([SOUND]): you only receive a transcript, you cannot hear me. So every few turns pick ONE word or phrase from our conversation that Italian speakers typically get wrong (th, h, short vs long vowels, schwa, final consonants, word stress, -ed endings, linking) and coach it: a simple respelling, the IPA, and how to shape the mouth.
- Conversation ([TALK]): now and then teach a skill that makes me sound fluent: fillers and thinking time, follow-up questions, hedging, agreeing and disagreeing politely, changing topic, telling a story well.
- NLP ([NLP]): roughly every 3-4 turns, link an NLP concept to the language I just used: meta-model questions (e.g. "everyone? who specifically?"), reframing, presuppositions, modal operators ("I can't" -> "I haven't yet"), sensory predicates (see/hear/feel language), Milton-model patterns, anchoring language. Explain it simply and show how to use it in English. Present NLP as a communication toolkit, not as proven science.

## Deeper explanations
- If I say "why?", "explain" or "perché?": give me a mini-lesson in [LESSON] (max ~120 words): the rule, 3 examples, the most common exception, and the contrast with Italian. Then ask me to make 2 sentences of my own using it, correct them, and go back to the conversation.
- If I repeat the SAME error twice in a session, automatically give me the mini-lesson, then continue.
- If I say "spiegamelo in italiano": explain that point in Italian inside [LESSON], then switch back to English immediately.
- If I ask any grammar question, answer it clearly in [LESSON] with examples and a quick practice exercise, then return to the conversation.

## Your style
- Speak at my level plus a little above. Natural spoken English: contractions, phrasal verbs, idioms, not textbook language.
- Keep your conversational part short (2-4 sentences). I should talk most of the time; explanations are the only thing allowed to make your turns longer.
- Every few turns, introduce one useful new expression naturally with [NEW] and later ask me to use it.
- If I keep using basic words ("very good", "nice", "thing", "do"), challenge me to find a more precise one.
- If you can't understand me, ask me to rephrase before helping.

## Language: English by default, Italian only when necessary
- Reply in English by default: [REPLY], [ASK], rules, tips and explanations are in English. Never switch to Italian on your own just to be helpful.
- If I switch to Italian (I write or speak in Italian), it means I'm stuck and really need Italian: answer that point in Italian, briefly and clearly, then go straight back to English: give me the English version of what I wanted to say and invite me to say it in English. Don't correct my Italian. (Italian speech may reach you badly transcribed: interpret it generously.)
- If I say in English that I don't understand ("I don't understand", "what?"), first rephrase in simpler English with an example. Use Italian only if I still don't understand after that.
- For a very specific or tricky word or idiom that a simple English explanation can't make clear, you may add the Italian translation in brackets, just a few words, e.g. "a bargain (un affare)". Do this rarely.
- If I say "come si dice..." followed by Italian, give me the English with a short example (in English) and ask me to say my full sentence again.
- Full explanations in Italian ONLY when I explicitly ask ("spiegamelo in italiano", "in italiano"): explain that one point in Italian inside [LESSON], then go straight back to English.
- My messages usually come from speech recognition: ignore likely transcription mistakes, and never correct spelling, punctuation or capitalization.

## Adaptive difficulty
- If I'm doing well for several turns, push harder: abstract topics, ask me to justify, compare, hypothesize (conditionals), tell stories in past tenses, use more advanced structures you've explained.
- If I'm struggling, simplify and give me a sentence starter.

## This session
- Mode: ${mode.line(sess && sess.detail)}${sess && sess.extra ? '\n- Extra goal: ' + sess.extra : ''}
- Corrections: ${corrLine}
- If I type a mode name ("free talk", "role play ...", "debate", "story", "grammar ...", "strict mode", "flow mode", "drill"), switch to it.

## Start
When the session starts: if there's a learner profile, recap in one sentence what we're working on, quickly review one rule from RULES TO REVIEW with a quick question, then open the conversation (in the session's mode) in a way that makes me practise it. Otherwise introduce yourself in one sentence and ask about me, so you can assess my level.

## Output format (an app parses your reply: follow it exactly)
Plain text only, no markdown (no asterisks, no #, no bullet lists). Put each part on its own line, starting with its tag. Separate the fields of a part with " ||| ".
[REPLY] your natural response, 2-4 sentences. Always present.
[FIX] what I said ||| better version ||| the rule in 1-2 simple sentences + one extra example ||| the Italian trap, or - if not relevant
[NATURAL] what I said ||| what a native would say ||| why
[SOUND] word or phrase ||| simple respelling and IPA ||| how to articulate it
[TALK] one conversation-skill tip linked to this moment
[NLP] concept name ||| simple explanation linked to what I said ||| an English example I can use
[NEW] expression ||| meaning ||| example sentence
[LESSON] mini-lesson text; it may continue on the following lines
[ASK] one open question. Always the last line.
In most turns use only [REPLY], any [FIX] needed, and [ASK]. Never more than one of [SOUND], [TALK], [NLP], [NEW] in the same turn.
Example:
[REPLY] Oh, a weekend in Rome sounds amazing! I went there years ago and got completely lost near the Pantheon.
[FIX] I have been in Rome last weekend ||| I was in Rome last weekend ||| With a finished time like "last weekend", use the past simple: "I saw her yesterday." ||| In Italian "sono stato" works for both, so you reach for the present perfect.
[ASK] What was the best thing you ate while you were there?`;
}

function transcriptText(s) {
  const out = [];
  for (const t of s.turns) {
    if (t.hidden) continue;
    if (t.role === 'user') out.push('LEARNER: ' + t.content);
    else out.push('OLIVER: ' + parseTutor(t.content).map((b) => `[${b.tag}] ${b.text}`).join(' '));

  let txt = out.join('\n');

        r.errors.length && { text: 'Let\'s fix these: ' + r.errors.map((e) => `say "${e.correct}"`).join('; '), language: 'en' },
        r.nextFocus && { text: 'Next time, we\'ll focus on: ' + r.nextFocus, language: 'en' },
      ].filter(Boolean)) }, icon('speaker'), 'Ascolta il riepilogo')),
  );
  window.scrollTo(0, 0);
}

/* ================= Notebook ================= */
function renderNotebook() {
  const v = $('#v-notebook'); const ss = state.sessions;
  const lp = state.profile.lp;
  const review = asList(lp && lp.rulesToReview).map((x) => x.toLowerCase());
  const errors = []; const rules = new Map(); const wordsMap = new Map();
  for (const s of ss) {
    const r = s.report || {};
    for (const e of r.errors || []) errors.push({ ...e, at: s.endedAt });
    for (const x of r.rules || []) { const k = x.name.toLowerCase(); if (!rules.has(k)) rules.set(k, { ...x, at: s.endedAt }); }
    for (const w of r.words || []) { const k = w.term.toLowerCase(); if (!wordsMap.has(k)) wordsMap.set(k, { ...w, at: s.endedAt }); }
  }
  const tabs = [['errors', 'Errori', errors.length], ['rules', 'Regole', rules.size], ['words', 'Parole', wordsMap.size], ['sessions', 'Sessioni', ss.length]];
  const seg = h('div', { class: 'seg', role: 'tablist', 'aria-label': 'Sezioni del quaderno' }, tabs.map(([id, name, n]) =>
    h('button', { role: 'tab', 'aria-selected': state.nbTab === id ? 'true' : 'false', onclick: () => { state.nbTab = id; renderNotebook(); } }, name, h('span', { class: 'n' }, String(n)))));
  let body;
  const empty = (t) => h('div', { class: 'empty' }, t);
  if (state.nbTab === 'errors') {
    const rec = asList(lp && lp.recurringErrors);
    body = [
      rec.length ? h('div', { class: 'card' }, h('div', { class: 'card-head' }, h('h2', {}, 'I tuoi errori ricorrenti'), h('button', { class: 'btn primary sm', onclick: () => maybeStart('drill', '') }, 'Allenali ora')), h('ul', { class: 'list' }, rec.map((e) => h('li', {}, e)))) : null,
      errors.length ? h('div', { class: 'card' }, h('h2', {}, 'Tutte le correzioni'), h('ul', { class: 'list' }, errors.map((e) => h('li', {}, h('span', { class: 'said' }, e.said), h('span', { class: 'better' }, e.correct), h('span', { class: 'muted', style: 'font-size:.9rem' }, (e.rule ? e.rule + ' · ' : '') + fmtDate(e.at))))))
        : empty('Ancora nessuna correzione salvata. Fai una sessione e termina con il report: gli errori finiscono qui.'),
    ];
  } else if (state.nbTab === 'rules') {
    const list = [...rules.values()];
    body = list.length ? [h('div', { class: 'card' }, h('ul', { class: 'list' }, list.map((x) => {
      const isRev = review.some((r) => r.includes(x.name.toLowerCase()) || x.name.toLowerCase().includes(r));
      return h('li', {}, h('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' }, h('strong', {}, x.name), isRev ? h('span', { class: 'pill review' }, 'da ripassare') : null),
        h('span', {}, x.summary), h('div', {}, h('button', { class: 'link-btn', onclick: () => maybeStart('grammar', x.name) }, 'Esercitati su questa regola')));
    })))] : [empty('Le regole spiegate nelle tue sessioni si raccolgono qui.')];
  } else if (state.nbTab === 'words') {
    const list = [...wordsMap.values()];
    body = list.length ? [
      h('div', { class: 'card-head' }, h('p', { class: 'muted' }, 'Le parole si fissano usandole. Oliver ti farà usare le ultime in una conversazione.'),
        h('button', { class: 'btn primary sm', onclick: () => maybeStart('free', '', 'Naturally create chances for me to use these expressions, and correct how I use them: ' + list.slice(0, 10).map((w) => w.term).join(', ')) }, 'Usale in una conversazione')),
      h('div', { class: 'words' }, list.map(wordCard))] : [empty('Le espressioni nuove che impari con Oliver finiscono qui, con esempio e pronuncia.')];
  } else {
    body = ss.length ? ss.map((s) => h('details', { class: 'sess' },
      h('summary', {}, h('div', {}, h('strong', {}, modeById(s.mode).name + (s.detail ? ': ' + s.detail : '')), h('div', { class: 'muted', style: 'font-size:.88rem' }, `${fmtDate(s.endedAt)} · ${s.minutes} min · ${s.userWords || 0} parole tue`)),
        h('span', { class: 'pill' }, ((s.report && s.report.errors) || []).length + ' correzioni')),
      h('div', {}, ...(s.report ? reportBody(s.report) : [h('p', { class: 'muted' }, 'Nessun report.')])))) : [empty('Lo storico delle sessioni comparirà qui.')];
  }
  v.replaceChildren(h('div', { class: 'card-head' }, h('h1', { style: 'font-size:clamp(1.7rem,4.5vw,2.3rem);font-weight:800' }, 'Quaderno'), seg), ...[].concat(body).filter(Boolean));
}

/* ================= Profile & settings ================= */
function renderProfile() {
  const v = $('#v-profile'); const p = state.profile; const st = settings();
  const level = new Set([p.level || 'unknown']); const goals = new Set(p.goals || []); const ints = new Set(p.interests || []);
  const goalList = [...new Set([...GOALS, ...(p.goals || [])])]; const intList = [...new Set([...INTERESTS, ...(p.interests || [])])];
  const saveAbout = () => { p.level = [...level][0]; p.goals = [...goals]; p.interests = [...ints]; saveProfile(); toast('Salvato'); };
  const levelG = chipGroup([{ value: 'unknown', label: 'Valutami tu' }, ...LEVELS.map((l) => ({ value: l, label: l }))], level, { multi: false, onChange: saveAbout });
  const goalG = chipGroup(goalList, goals, { onChange: saveAbout });
  const intG = chipGroup(intList, ints, { onChange: saveAbout });
  const wrapAdd = (list, sel, g, ph) => { const el = addInput(list, sel, g, ph); el.querySelector('button').addEventListener('click', saveAbout); el.querySelector('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveAbout(); }); return el; };
  const sw = (key, title, sub) => { const id = 'set-' + key; return h('label', { class: 'switch', for: id }, h('span', { class: 't' }, h('span', {}, title), sub ? h('small', {}, sub) : null), h('input', { type: 'checkbox', class: 'toggle', id, checked: !!st[key], onchange: (e) => { setSetting(key, e.target.checked); } })); };
  const voiceSel = h('select', { class: 'input', id: 'set-voice', style: 'width:auto', onchange: (e) => setSetting('voice', e.target.value) }, ['buttery', 'airy', 'glassy', 'rounded'].map((x) => h('option', { value: x, selected: st.voice === x }, x)));
  const rateOut = h('span', { style: 'font-variant-numeric:tabular-nums;min-width:3ch' }, st.rate.toFixed(1) + '×');
  const rate = h('input', { type: 'range', id: 'set-rate', min: '0.7', max: '1.3', step: '0.1', value: String(st.rate), 'aria-label': 'Velocità della voce',
    oninput: (e) => { rateOut.textContent = Number(e.target.value).toFixed(1) + '×'; }, onchange: (e) => { const r = Number(e.target.value); setSetting('rate', r); try { Caps.tts && Caps.tts.setRate && Caps.tts.setRate(r).catch(() => {}); } catch {} } });
  const corrSel = h('select', { class: 'input', id: 'set-corr', style: 'width:auto', onchange: (e) => setSetting('correction', e.target.value) }, Object.entries({ normal: 'Normali (max 2 per turno)', strict: 'Tutte (strict mode)', flow: 'Solo nel report (flow mode)' }).map(([k, t]) => h('option', { value: k, selected: st.correction === k }, t)));
  const accSel = h('select', { class: 'input', id: 'set-acc', style: 'width:auto', onchange: (e) => setSetting('accurate', e.target.value === '1') }, h('option', { value: '0', selected: !st.accurate }, 'Rapide'), h('option', { value: '1', selected: st.accurate }, 'Più accurate (più lente)'));
  const row = (title, sub, ctl) => h('div', { class: 'switch' }, h('span', { class: 't' }, h('span', {}, title), sub ? h('small', {}, sub) : null), ctl);
  v.replaceChildren(
    h('h1', { style: 'font-size:clamp(1.7rem,4.5vw,2.3rem);font-weight:800' }, 'Profilo'),
    h('div', { class: 'grid-2' },
      h('div', { class: 'card' }, h('h2', {}, 'Su di te'),
        h('div', { class: 'field' }, h('span', {}, 'Livello'), levelG),
        h('div', { class: 'field' }, h('span', {}, 'Obiettivi'), goalG, wrapAdd(goalList, goals, goalG, 'Altro obiettivo…')),
        h('div', { class: 'field' }, h('span', {}, 'Interessi'), intG, wrapAdd(intList, ints, intG, 'Altro interesse…'))),
      h('div', { class: 'card' }, h('h2', {}, 'Come lavora Oliver'),
        h('div', {},
          sw('voiceOn', 'Oliver parla ad alta voce', 'Legge risposta, correzioni brevi e domanda'),
          row('Voce', null, voiceSel),
          row('Velocità della voce', null, h('span', { style: 'display:flex;gap:10px;align-items:center' }, rate, rateOut)),
          sw('readAll', 'Leggi anche regole e suggerimenti', 'Più completo, ma più lungo da ascoltare'),
          sw('autoSend', 'Invia appena smetti di parlare', 'Quando fermi il microfono il messaggio parte da solo'),
          row('Correzioni', 'Valgono dalla prossima sessione', corrSel),
          row('Risposte', 'Le accurate ragionano di più prima di rispondere', accSel)))),
    h('div', { class: 'card' },
      h('div', { class: 'card-head' }, h('h2', {}, 'Il profilo che Oliver ricorda'), p.lp ? h('button', { class: 'link-btn', onclick: (e) => copyText(lpText(p.lp), e.currentTarget) }, icon('copy'), 'Copia') : null),
      p.lp ? h('pre', { class: 'profile' }, lpText(p.lp)) : h('p', { class: 'muted' }, 'Si crea alla fine della prima sessione, con il report.')),
    h('div', { class: 'card' },
      h('h2', {}, 'Le istruzioni di Oliver'),
      h('p', { class: 'muted' }, 'Questo è il prompt con cui Oliver lavora, già compilato con il tuo profilo. Puoi copiarlo e usarlo anche nella modalità vocale dell’app Claude sul telefono.'),
      h('details', { class: 'prompt' }, h('summary', {}, 'Mostra il prompt'), h('pre', { class: 'profile' }, buildRules(null))),
      h('div', {}, h('button', { class: 'btn ghost sm', onclick: (e) => copyText(buildRules(null), e.currentTarget) }, icon('copy'), 'Copia il prompt'))),
    h('div', { class: 'card' },
      h('h2', {}, 'I tuoi dati'),
      h('p', { class: 'muted' }, Store.remote ? 'Profilo e sessioni sono salvati in privato nel tuo account: li vedi solo tu, anche da altri dispositivi.' : 'Profilo e sessioni sono salvati solo in questo browser.'),
      h('div', {}, h('button', { class: 'btn danger sm', onclick: async () => {
        const ok = await confirmDialog({ title: 'Cancellare tutti i dati?', text: 'Profilo, sessioni, report e parole verranno eliminati. Non si può annullare.', ok: 'Cancella tutto', danger: true });
        if (!ok) return;
        await Store.wipe(); state.profile = null; state.sessions = []; state.session = null; toast('Dati cancellati'); route();
      } }, 'Cancella tutti i dati'))),
  );
}

/* ================= Static bindings & boot ================= */
function bindStatic() {
  const tabDefs = { home: ['today', 'Oggi'], notebook: ['book', 'Quaderno'], profile: ['user', 'Profilo'] };
  for (const t of document.querySelectorAll('.tab')) { const [ic, lab] = tabDefs[t.dataset.view]; t.replaceChildren(icon(ic), h('span', {}, lab)); t.addEventListener('click', () => { state.view = t.dataset.view; go(t.dataset.view); }); }
  $('#brand').addEventListener('click', () => { if (state.profile) { state.view = 'home'; go('home'); } });
  window.addEventListener('hashchange', () => { state.view = viewFromHash(); route(); });
  $('#s-exit').replaceChildren(icon('back'));
  $('#s-exit').addEventListener('click', closeSession);
  $('#s-end').addEventListener('click', endSession);
  $('#s-board-btn').prepend(icon('book'));
  $('#s-board-btn').addEventListener('click', openSheet);
  $('#send').replaceChildren(icon('send'));
  $('#send').addEventListener('click', send);
  $('#mic').addEventListener('click', micClick);
  const ta = $('#input');
  ta.addEventListener('input', () => { autosize(); syncSend(); });
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(pointer:fine)').matches) { e.preventDefault(); send(); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#sheet')) { e.preventDefault(); closeSheet(); } });
  renderMic();
}
async function boot() {
  bindStatic();
  state.profile = LS.get('profile');
  state.sessions = LS.get('sessions') || [];
  state.session = LS.get('current');
  route();
  initCaps().then(() => { if (!$('#v-home').hidden) renderHome(); renderStatus(); });
  await Store.init();
  if (Store.remote) {
    try {
      const [p, cur, list] = await Promise.all([Store.getDoc('profile'), Store.getDoc('current'), Store.listSessions()]);
      if (p) { state.profile = p; LS.set('profile', p); }
      else if (state.profile) await Store.setDoc('profile', state.profile);
      if (cur) { state.session = cur; LS.set('current', cur); } else if (state.session) await Store.setDoc('current', state.session);
      state.sessions = list.length ? list : state.sessions;
    } catch { toast('Non raggiungo i dati salvati: uso la copia su questo dispositivo.'); }
    if ($('#v-session').hidden && state.view !== 'report') route();
  }
}
boot();
})();
